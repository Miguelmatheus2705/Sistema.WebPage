version: '3.9'

services:
  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistema-webpage
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./Sistema.WebPage/System.WebPage:/app/Sistema.WebPage:ro
